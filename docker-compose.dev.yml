services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-my_tashabbus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-my_tashabbus_password}
      POSTGRES_DB: ${POSTGRES_DB:-my_tashabbus}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    environment:
      APP_ENV: ${APP_ENV:-development}
      API_HOST: 0.0.0.0
      API_PORT: ${API_PORT:-8080}
      DATABASE_URL: ${DATABASE_URL:-postgres://my_tashabbus:my_tashabbus_password@postgres:5432/my_tashabbus?sslmode=disable}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  bot:
    build:
      context: ./apps/bot
    profiles:
      - bot
    environment:
      BOT_ENV: ${BOT_ENV:-development}
      BOT_TOKEN: ${BOT_TOKEN:-}
      API_BASE_URL: ${API_BASE_URL:-http://api:8080}
      MINI_APP_URL: ${MINI_APP_URL:-http://localhost:5174}
    depends_on:
      - api

volumes:
  postgres_data:
